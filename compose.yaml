name: oyecouture

services:
  postgres:
    image: postgres:16-alpine
    container_name: oyecouture-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oye
      POSTGRES_PASSWORD: oye
      POSTGRES_DB: oyecouture
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oye -d oyecouture"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
